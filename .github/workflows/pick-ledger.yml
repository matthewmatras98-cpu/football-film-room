name: pick-ledger

on:
  push:
    branches: [main]
    paths:
      - data/picks.csv

permissions:
  contents: read

concurrency:
  group: pick-ledger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.LEDGER_DEPLOY_KEY }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Sync
        working-directory: pipeline
        run: uv sync --frozen

      - name: Validate and append ledger
        working-directory: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NFLREADPY_CACHE: "off"
          NFLREADPY_CACHE_DURATION: "0"
        run: |
          set -euo pipefail
          uv run --frozen python -m football_pipeline validate
          uv run --frozen python -m football_pipeline ledger

      - name: Commit ledger if it changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The ledger file is already written. Grade from it so this commit
          # includes the new first_pushed_at. The deploy key pushes the commit
          # and can start workflows. data/picks.csv is not staged, so
          # pick-ledger does not run again.
          if (cd pipeline && uv run --frozen python -m football_pipeline grade --no-fetch); then
            git add -- data/pick_ledger.csv src/data/summary.json src/data/picks_view.json
          else
            echo "::warning::picks view refresh failed; weekly will republish"
            git checkout -- src/data/summary.json src/data/picks_view.json
            git add -- data/pick_ledger.csv
          fi
          if git diff --cached --quiet; then
            echo "ledger unchanged"
            exit 0
          fi
          git commit -m "Update pick ledger"
          bash scripts/push_with_retry.sh
