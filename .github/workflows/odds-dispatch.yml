name: odds-dispatch

on:
  schedule:
    # Half-hour ticks every day. GitHub may delay or drop these; the job waits
    # inside the run so a close shot does not depend on the tick landing in the window.
    - cron: "7,37 12-23 * * *"
    - cron: "7,37 0-3 * * *"
    # Game days, every 10 minutes, offset off :00. Phoenix does not observe DST,
    # so the late Sunday kickoffs stay at 21:05 and 21:25 UTC.
    # Thursday night (K about 01:15 UTC Friday): Thu 23 and Fri 00-01.
    - cron: "3,13,23,33,43,53 23 * * 4"
    - cron: "3,13,23,33,43,53 0-1 * * 5"
    # Sunday: London ~13:30 UTC, early 18:00, late 21:05/21:25, SNF 01:20 Monday.
    - cron: "3,13,23,33,43,53 12-23 * * 0"
    - cron: "3,13,23,33,43,53 0-1 * * 1"
    # Monday night (K about 01:20 UTC Tuesday): Mon 23 and Tue 00-01.
    - cron: "3,13,23,33,43,53 23 * * 1"
    - cron: "3,13,23,33,43,53 0-1 * * 2"
    # Saturday late season: Sat 18-23 and Sun 00-01.
    - cron: "3,13,23,33,43,53 18-23 * * 6"
    - cron: "3,13,23,33,43,53 0-1 * * 0"
    # Wednesday night (K about 01:00 UTC Thursday), e.g. 2026 Week 12 GB@LA.
    - cron: "3,13,23,33,43,53 23 * * 3"
    - cron: "3,13,23,33,43,53 0-1 * * 4"
    # Thanksgiving Thursday daytime: early 18:00 UTC and afternoon 21:30 UTC.
    - cron: "3,13,23,33,43,53 16-21 * * 4"
    # Friday afternoon (K about 20:00 UTC), e.g. 2026 Week 12 DEN@PIT.
    - cron: "3,13,23,33,43,53 18-20 * * 5"
    # Christmas Day 2026 (Week 16, Fri Dec 25): 18:00 and 21:30 UTC, plus
    # 01:15 UTC Sat Dec 26. Date-specific so ordinary Fridays stay unchanged.
    - cron: "3,13,23,33,43,53 16-17,21,23 25 12 *"
    - cron: "3,13,23,33,43,53 0-1 26 12 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check secrets, D1 schema, and event mapping. Calls /events only (0 credits)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: odds-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Sync
        working-directory: pipeline
        run: uv sync --frozen

      - name: Dispatch
        working-directory: pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          NFLREADPY_CACHE: "off"
          NFLREADPY_CACHE_DURATION: "0"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run --frozen python -m football_pipeline dispatch --dry-run
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            uv run --frozen python -m football_pipeline dispatch --wait-max-minutes 45
          else
            uv run --frozen python -m football_pipeline dispatch
          fi
