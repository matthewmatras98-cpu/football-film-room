name: weekly

on:
  schedule:
    # Tuesday 6:07 AM MST. Phoenix does not observe DST, so this is 13:07 UTC.
    - cron: "7 13 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Sync
        working-directory: pipeline
        run: uv sync --frozen

      - name: Refresh, pull snapshots, grade, export lines
        working-directory: pipeline
        env:
          NFLREADPY_CACHE: "off"
          NFLREADPY_CACHE_DURATION: "0"
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          uv run --frozen python -m football_pipeline refresh
          uv run --frozen python -m football_pipeline pull-snapshots --out ../data/.cache/week.d1dump.csv
          as_of="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run --frozen python -m football_pipeline grade --as-of "$as_of" --snapshots ../data/.cache/week.d1dump.csv
          uv run --frozen python -m football_pipeline lines-export --as-of "$as_of" --snapshots ../data/.cache/week.d1dump.csv

      - name: Commit grader outputs if they changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GITHUB_TOKEN pushes do not start workflows. This step also never
          # stages data/picks.csv, so pick-ledger is not an event for this commit.
          # Pushing to main may need the ruleset bypass Matthew is adding.
          git add -- data/graded.csv src/data/summary.json src/data/picks_view.json
          if compgen -G "data/lines/*.csv" > /dev/null; then
            git add -- data/lines
          fi
          if git diff --cached --quiet; then
            echo "no grader changes"
            exit 0
          fi
          git commit -m "Grade picks and publish derived lines"
          bash scripts/push_with_retry.sh
