name: weekly

on:
  schedule:
    # Tuesday 6:07 AM MST. Phoenix does not observe DST, so this is 13:07 UTC.
    - cron: "7 13 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Sync
        working-directory: pipeline
        run: uv sync --frozen

      - name: Refresh and grade
        working-directory: pipeline
        env:
          NFLREADPY_CACHE: "off"
          NFLREADPY_CACHE_DURATION: "0"
        run: |
          set -euo pipefail
          uv run --frozen python -m football_pipeline refresh
          uv run --frozen python -m football_pipeline grade --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Commit grader outputs if they changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GITHUB_TOKEN pushes do not start workflows. This step also never
          # stages data/picks.csv, so pick-ledger is not an event for this commit.
          # Pushing to main may need the ruleset bypass Matthew is adding.
          git add -- data/graded.csv src/data/summary.json src/data/picks_view.json
          if git diff --name-only --cached | grep -qx 'data/picks.csv'; then
            echo "weekly must not modify data/picks.csv"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "no grader changes"
            exit 0
          fi
          git commit -m "Grade picks from the latest schedules"
          git push
