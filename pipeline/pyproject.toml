[project]
name = "football-pipeline"
version = "0.1.0"
description = "Pick grader and ledger for the football analysis site"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "nflreadpy==0.1.5",
    "polars==2.1.0",
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["football_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
